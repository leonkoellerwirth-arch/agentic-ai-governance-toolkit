# Governance Gate — a composite action that turns the evaluator's exit codes into a CI gate.
#
# Why this exists: `readiness`, `policy-check` and `log-analyze` already exit non-zero on a
# finding (BIBLE §"the evaluator proves provenance, not truth"). What was missing was the
# wiring — a consuming repository had to install the toolkit and know the CLI. It no longer
# does; it references this action.
#
# The run is the evidence. Every check writes machine-readable JSON to the evidence directory
# and a human-readable block to the job summary, both stamped with the evaluator version, the
# action ref and the commit under test. A reviewer can read the summary; an auditor can read
# the JSON. Neither has to trust a screenshot.
#
# This action is a thin wrapper around scripts/governance-gate.sh. The logic lives in the script
# so it runs offline, in any CI, or in a pre-commit hook, and so CI and the local run cannot drift
# (CONSTITUTION §4). If you have no GitHub Actions budget, call the script directly — nothing here
# is required.
#
# Zero-trust: the one external action is pinned to a full commit SHA, matching ci.yml.
# Not legal advice — see DISCLAIMER.md.

name: Governance Gate
description: >-
  Gate a pull request on AI-agent governance findings — organizational readiness,
  policy violations and audit-log thresholds. Exits non-zero on any finding.

branding:
  icon: shield
  color: gray-dark

inputs:
  readiness:
    description: >-
      Path to the organization readiness YAML (every agent in production with its control
      level and R0-R3 scores). Omit to skip the readiness check.
    required: false
    default: ""
  assessment:
    description: >-
      Path to the agent assessment YAML (name, six dimension scores, data_categories,
      human_in_the_loop). Requires `policy`. Omit to skip the policy check.
    required: false
    default: ""
  logs:
    description: >-
      Path to a JSONL audit trail, one event per line — the format written by
      local-agent-pipeline. Requires `policy`. Omit to skip log analysis.
    required: false
    default: ""
  policy:
    description: Path to the policy YAML. Required when `assessment` or `logs` is set.
    required: false
    default: ""
  python-version:
    description: Python version used to run the evaluator.
    required: false
    default: "3.11"
  evidence-path:
    description: Directory the JSON evidence is written to.
    required: false
    default: governance-evidence
  artifact-name:
    description: >-
      Base name for the uploaded evidence artifact; the run id is appended. Override it when a
      workflow runs this action more than once per run, or the second upload collides.
    required: false
    default: governance-evidence
  fail-on-findings:
    description: >-
      "true" (default) fails the job on any finding — this is the point of a gate. Set to
      "false" only for a reporting-only rollout, and set a date by which it flips back.
    required: false
    default: "true"

outputs:
  passed:
    description: '"true" when every requested check was clean.'
    value: ${{ steps.gate.outputs.passed }}
  evidence-path:
    description: Directory containing the JSON evidence files.
    value: ${{ inputs.evidence-path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install evaluator
      shell: bash
      run: pip install --quiet "$GITHUB_ACTION_PATH/evaluator"

    - name: Run governance gate
      id: gate
      shell: bash
      env:
        IN_READINESS: ${{ inputs.readiness }}
        IN_ASSESSMENT: ${{ inputs.assessment }}
        IN_LOGS: ${{ inputs.logs }}
        IN_POLICY: ${{ inputs.policy }}
        EVIDENCE: ${{ inputs.evidence-path }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: |
        set +e
        set -uo pipefail
        args=(--evidence "$EVIDENCE" --summary "$GITHUB_STEP_SUMMARY")
        [ -z "$IN_READINESS" ]  || args+=(--readiness "$IN_READINESS")
        [ -z "$IN_ASSESSMENT" ] || args+=(--assessment "$IN_ASSESSMENT")
        [ -z "$IN_LOGS" ]       || args+=(--logs "$IN_LOGS")
        [ -z "$IN_POLICY" ]     || args+=(--policy "$IN_POLICY")
        [ "$FAIL_ON_FINDINGS" != "false" ] || args+=(--no-fail)

        "$GITHUB_ACTION_PATH/scripts/governance-gate.sh" "${args[@]}"
        rc=$?

        # rc 2 is a misconfiguration and never a pass. rc 1 means findings; with --no-fail the
        # script already exited 0, so reaching here with 1 means the gate is meant to block.
        if [ "$rc" -eq 0 ]; then
          # --no-fail exits 0 even with findings; read the summary to report `passed` honestly.
          if grep -q '^### ❌' "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
          else
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi
        echo "passed=false" >> "$GITHUB_OUTPUT"
        exit "$rc"

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}-${{ github.run_id }}
        path: ${{ inputs.evidence-path }}
        if-no-files-found: warn
