# =============================================================================
# THE REGISTER OF JUDGEMENT CALLS.
#
# Every threshold in a rubric is one of two things:
#
#   DERIVED       — traceable to a demand the toolkit already makes elsewhere.
#                   Recorded in the rubric itself (`derived_from`, `reason`).
#   POLICY        — a judgement call. Recorded HERE, with its rationale, what it
#                   accepts as a cost, and whether anything outside this project
#                   supports it.
#
# Nothing may be neither. `agent_evaluator.policy` computes the thresholds that
# need covering straight from the rubric files, so adding a band or an override
# without recording the decision fails the check — and a decision pointing at a
# threshold that no longer exists fails it too.
#
# Why this file exists: the README says the thresholds are "a starting point, not
# a calibrated standard". That sentence is honest but unhelpful to someone who has
# to defend a control level in a review. This file is the long version — which
# numbers are judgement, whose judgement, and what each one gets wrong on purpose.
#
# `external_support` is deliberately mostly empty. A judgement call with an
# invented citation is worse than one that admits it is a judgement call.
#
# Read by:   agent_evaluator.policy
# Rendered:  docs/02-risk-assessment/policy-decisions.md
#            → run `agent-eval render-docs` after editing.
# Tested:    evaluator/tests/test_policy_decisions.py
# =============================================================================

version: 1
title: Policy decisions

decisions:
  - id: PD-DIMENSIONS-001
    target: rubric.yaml#dimensions
    decision: Six dimensions, each scored 1–5 against observable anchors.
    rationale:
      - >-
        Each dimension names something a reviewer can ask for evidence about and be
        told no. "How autonomous is it?" is answerable; "how mature are you?" is not.
      - >-
        Five steps: three collapses everything interesting into the middle, seven
        invites a precision the anchors cannot carry.
      - >-
        These six change what controls an agent needs. Cost, business value, and
        model quality do not, and are deliberately absent.
    external_support: []
    accepted_cost: >-
      The dimensions are not independent — an agent with a wide action space usually
      also scores high on blast radius. Summing them treats correlated risk as if it
      were additive, which counts some of it twice. The alternative (a weighted or
      conditional model) would need calibration data that does not exist.
    status: project_policy

  - id: PD-SCALE-001
    target: rubric.yaml#scale
    decision: The scale runs 1–5, with 1 as the lowest meaningful score — not 0.
    rationale:
      - >-
        Every agent in production has some autonomy, some action space, and some
        blast radius. A zero would claim an absence that does not occur once an
        agent is running.
      - >-
        The readiness rubric does the opposite and starts at R0, because "no control
        at all" is a real and common state. Exposure and readiness are not symmetric.
    external_support: []
    accepted_cost: >-
      The minimum total is 6, not 0, so the numbers do not read as a percentage. That
      is intentional, but it does mean the total cannot be shared without the bands.
    status: project_policy

  - id: PD-AGG-001
    target: rubric.yaml#aggregation.method
    decision: Sum the six dimensions with equal weight.
    rationale:
      - >-
        Weights would have to come from somewhere. There is no outcome data behind
        this rubric, so any weighting would encode a preference while looking like a
        measurement.
      - >-
        A sum can be recomputed by hand from the scored dimensions. Anyone in a review
        can check the arithmetic without the tool.
    external_support: []
    accepted_cost: >-
      Equal weight is itself a claim: it says explainability matters as much as blast
      radius. It does not. The override rules are the correction — they let a single
      categorical risk raise the floor without pretending the sum knew about it.
    status: project_policy

  - id: PD-BANDS-001
    target: rubric.yaml#aggregation.bands
    decision: Band boundaries at 10 / 16 / 22 — C1 6–10, C2 11–16, C3 17–22, C4 23–30.
    rationale:
      - >-
        The cuts are placed so that an assistive agent scoring low across the board
        lands in C1, an agent writing to a system of record under human approval lands
        in C2–C3, and an agent that is high on several dimensions at once lands in C4.
      - >-
        C2 is deliberately the widest band. It is the band whose controls a normal
        organization can actually staff, and most production agents belong there.
    external_support: []
    accepted_cost: >-
      THIS IS THE LEAST DEFENSIBLE NUMBER IN THE RUBRIC, and it should be said first
      rather than discovered. The boundaries are not calibrated against incident data,
      because none was available. An agent scoring 16 and one scoring 17 differ by one
      point and by an entire control regime, and nothing empirical distinguishes them.
      Anyone applying this in anger should expect to move the cuts against their own
      incident history — and should record it when they do, which is what this file is
      for.
    status: project_policy

  - id: PD-OVERRIDE-ACTION-SPACE
    target: rubric.yaml#aggregation.overrides.action_space
    decision: An action space of 5 forces a floor of C4, whatever the total.
    rationale:
      - >-
        Acting on the outside world — moving funds, sending an external message,
        forming an obligation — is categorical, not additive. A low total does not
        make an irreversible external act light-touch.
    external_support: []
    accepted_cost: >-
      An otherwise trivial agent that can send one external message is governed like a
      payments agent. Deliberate: the failure mode is the message, not the volume. The
      cost is a control regime that will feel disproportionate to the team running it,
      and that argument will be had repeatedly.
    status: project_policy

  - id: PD-OVERRIDE-REVERSIBILITY
    target: rubric.yaml#aggregation.overrides.reversibility
    decision: Reversibility of 5 forces a floor of C3.
    rationale:
      - >-
        What cannot be undone must be stopped before it happens; that is a human in
        the loop, which is where C3 starts.
      - >-
        C3 rather than C4 because irreversibility alone, without reach, affects one
        case at a time. Reach is what blast radius scores.
    external_support: []
    accepted_cost: >-
      An irreversible action with wide reach reaches C4 only via the total or the
      action-space override. If both are low and the effect is still catastrophic, the
      rubric under-rates it.
    status: project_policy

  - id: PD-OVERRIDE-DATA-SENSITIVITY
    target: rubric.yaml#aggregation.overrides.data_sensitivity
    decision: Data sensitivity of 5 forces a floor of C3.
    rationale:
      - >-
        Special-category personal data and secrets carry duties that do not scale down
        with how few records are touched.
    external_support: []
    accepted_cost: >-
      Overrides only ever raise the floor, never lower it. An agent touching one
      credential in a strictly bounded way gets C3 controls it may not need. That is
      the cheaper error of the two, and the exception path exists for the rest.
    status: project_policy

  # --- readiness.yaml ---------------------------------------------------------
  # The second rubric asks whether the organization can carry the exposure the first one
  # measures. Its thresholds are judgements of a different kind: not "how risky is this
  # agent" but "how much control does that risk oblige you to have". Every one of them is
  # bounded by the same rule — the readiness rubric may never demand more than the exposure
  # rubric already demands, or the derivation claim in `readiness.yaml` is false.

  - id: PD-R-DIMENSIONS-001
    target: readiness.yaml#dimensions
    decision: Six readiness dimensions, each derived from a demand the toolkit already makes.
    rationale:
      - >-
        Every dimension points at an existing artefact — the C1–C4 control lists, the go-live
        gate, the logging requirements, the KPI catalog, decision rights, RACI. `derived_from`
        records which, so the claim "nothing here is invented" is checkable rather than asserted.
      - >-
        Each dimension names something a reviewer can ask for evidence about and be told no. The
        `probe` field is that question in its shortest form: a dimension that cannot be probed
        would be a maturity opinion, not a readiness measurement.
      - >-
        Six, and not more, because a dimension without a demand behind it would have to be
        invented. Identity and access management is the clearest candidate for a seventh and is
        recorded as a known simplification instead — see `simplifications.entitlements`.
    external_support: []
    accepted_cost: >-
      The dimensions inherit whatever the toolkit's own control lists get wrong. If a control is
      missing there, readiness cannot see it — the rubric measures conformance to this toolkit,
      not to the state of the art. Entitlements is the known instance: an agent can be confined to
      its documented action space and still hold credentials reaching systems that never appear in
      it, and this rubric will score that organization as ready.
    status: project_policy

  - id: PD-R-SCALE-001
    target: readiness.yaml#scale
    decision: The readiness scale runs R0–R3, and R0 is honestly zero.
    rationale:
      - >-
        Exposure starts at 1 because every running agent has some autonomy. Readiness starts at 0
        because "no decision trail at all" and "no defined stop at all" are real, common states,
        and a scale that cannot express them flatters every organization that is in one.
      - >-
        Four steps, not five: the anchors distinguish absent, described, demonstrated, and
        sustained. A fifth step would need a distinction the evidence behind it cannot carry.
      - >-
        The R2 anchors are deliberately written as demonstrations rather than as existence claims
        — "has been triggered at least once", "the refusal path is covered by a test". That is
        what makes R2 the meaningful threshold and R1 the honest resting place for paper controls.
    external_support: []
    accepted_cost: >-
      Four steps compress the distance between a mature organization and an exceptional one: R3 has
      to cover everything from "reconciliation happens" to "reconciliation finds discrepancies". An
      organization at a genuine R3 gets no room above it, so the rubric cannot show improvement past
      the point where it stops being interesting to a reviewer.
    status: project_policy

  - id: PD-R-REQ-INVENTORY
    target: readiness.yaml#dimensions.inventory.required
    decision: Inventory clarity required at R1/R2/R2/R3 for C1/C2/C3/C4.
    rationale:
      - >-
        Derived: the C1 control list demands only a recorded owner (R1). C2 adds documented intake
        and a risk assessment on file, which is the R2 anchor, and C3 adds nothing further to the
        registry itself — so C3 stays at R2 rather than inventing a demand.
      - >-
        C4 reaches R3 because the value-chain role and the provider and model dependencies are what
        the go-live gate and the provider-dependency doc require at that level; periodic
        reconciliation is the only way those stay true rather than being true once.
    external_support: []
    accepted_cost: >-
      C3 and C2 carry the same requirement, so the rubric cannot distinguish an organization that
      merely registered its C3 agents from one that governs them well. Inventory is the dimension
      where a self-assessment is cheapest to pass and where passing means least.
    status: project_policy

  - id: PD-R-REQ-OVERSIGHT
    target: readiness.yaml#dimensions.oversight.required
    decision: Action space and intervention required at R1/R2/R2/R3 for C1/C2/C3/C4.
    rationale:
      - >-
        Derived: technical enforcement of the action space plus a tested refusal path is the R2
        anchor, and it is what the C2 control list already implies once an agent writes anywhere.
        The explicit human gate that C3 demands is inside the same anchor, so C3 stays at R2.
      - >-
        C4 reaches R3 because per-action pre-authorization is a C4 control verbatim, and because the
        blocked-action rate only means something if it is watched rather than merely written down.
    external_support: []
    accepted_cost: >-
      A C3 agent and a C2 agent are held to the same enforcement standard, which understates how
      much more a human-in-the-loop gate costs to run than a documented boundary. The rubric sees
      that the gate exists; it does not see whether the humans behind it have the time to use it,
      and a rubber-stamped approval scores exactly like a considered one.
    status: project_policy

  - id: PD-R-REQ-TRACEABILITY
    target: readiness.yaml#dimensions.traceability.required
    decision: Reconstructability required at R1/R2/R3/R3 for C1/C2/C3/C4 — the only dimension at R3 by C3.
    rationale:
      - >-
        Derived: the mandatory log fields are an R2 anchor and apply from C2. C3 reaches R3 because
        an audit trail an agent could rewrite is not an audit trail, and integrity protection is the
        difference between the R2 and R3 anchors.
      - >-
        This is the only dimension pulled to R3 one level early. The reason is asymmetry of repair:
        every other gap can be closed going forward, but a decision that was never traceable cannot
        be made traceable afterwards. The evidence is either there at the time or it is gone.
    external_support: []
    accepted_cost: >-
      C3 organizations are held to a standard the C3 control list does not literally spell out —
      the one place this rubric demands slightly more than the exposure rubric, justified by the
      irreversibility above and named here rather than hidden. The practical cost is real: retention
      rules, restricted read access, and append-only storage are the most expensive R3 in the set,
      and an organization can reasonably decide the trade is not worth it for its C3 agents.
    status: project_policy

  - id: PD-R-REQ-CONTAINMENT
    target: readiness.yaml#dimensions.containment.required
    decision: Stop and roll back required at R0/R1/R2/R3 — the only dimension whose requirement starts at zero.
    rationale:
      - >-
        Derived: the C1 control list demands no kill-switch, so demanding one would ask more than
        the exposure rubric does. A read-only assistant is stopped by turning it off, and pretending
        otherwise would make the whole scale unfalsifiable at the bottom.
      - >-
        R2 requires that the kill-switch has actually been triggered under realistic conditions with
        a measured time to effect. A documented but never-exercised stop path is R1 by construction
        — that distinction is the point of the dimension.
    external_support: []
    accepted_cost: >-
      A C1 agent with no stop path at all is scored ready on this dimension. That is defensible only
      as long as the control level is right; a mis-scored C1 agent that in fact writes somewhere
      inherits a blind spot here rather than a gap, and this rubric cannot detect the mis-scoring
      because it takes the control level as given.
    status: project_policy

  - id: PD-ASSURANCE-001
    target: readiness.yaml#dimensions.assurance.required
    decision: Independent assurance required at R1/R1/R2/R3 — C2 stays at R1, deliberately.
    rationale:
      - >-
        Derived, and the derivation is the whole argument: the C2 control list demands a named,
        signing owner and nothing more. Independent 2nd-line review first appears as a C3 control.
        Requiring R2 at C2 would make the readiness rubric demand more than the exposure rubric,
        which is exactly the failure mode `derived_from` exists to prevent.
      - >-
        Keeping the two rubrics consistent is worth more than tightening one number. If C2 should
        demand independent review, the correction belongs in the C2 control list in `rubric.yaml`,
        where it would apply to everything downstream — not smuggled in here.
    external_support: []
    accepted_cost: >-
      Stated rather than hidden: a C2 agent writing into systems the business depends on may be
      signed off by the team that built it. That is a real exposure, and this rubric will not flag
      it. Anyone who finds the trade unacceptable should raise the C2 control list rather than this
      row, and should expect the readiness bar to follow automatically.
    status: project_policy

  - id: PD-R-REQ-CURRENCY
    target: readiness.yaml#dimensions.currency.required
    decision: Currency required at R1/R2/R2/R3 for C1/C2/C3/C4.
    rationale:
      - >-
        Derived: C1 re-assesses on material change (R1); C2 adds monitored operational KPIs and an
        annual re-assessment, which is the R2 anchor. C3 keeps R2 — the quarterly cadence it adds
        is a frequency, not a new capability.
      - >-
        C4 reaches R3 because R3 is the only anchor that asks whether the cadence is actually being
        met and whether a breached threshold has ever been escalated in practice.
    external_support: []
    accepted_cost: >-
      The rubric measures that re-assessment happens, never whether it finds anything. An
      organization that re-assesses quarterly and changes nothing scores identically to one whose
      re-assessments produce findings — the more valuable of the two is invisible here.
    status: project_policy

  - id: PD-R-AGG-001
    target: readiness.yaml#aggregation.per_dimension
    decision: >-
      Non-compensatory minimum: required is the highest any agent triggers, achieved is the lowest
      reached by an agent that triggers it. No single index value is produced.
    rationale:
      - >-
        This is a chosen decision rule, not a proven correctness. It is stated that way on purpose:
        a weak critical control should not be compensated by strong values elsewhere, because the
        organization is reached through its weakest high-risk agent, not through its average one.
      - >-
        A mean would be flattered by harmless agents. An organization with nine C1 assistants and
        one C4 payments agent would average its way to a comfortable number while the only agent
        that can cause real damage sits unguarded.
      - >-
        No 0–100 index, because a single number invites optimizing the number instead of the
        control. "4 of 6 at exposure C3" cannot be quoted without its exposure, which is the
        property that makes it safe to share.
    external_support: []
    accepted_cost: >-
      A minimum is brittle and easy to argue with: one agent at R1 drags the dimension to R1 no
      matter how good the other twenty are, and the organization will experience that as unfair. The
      per-dimension detail ("1 of 3 C4 agents below target") is the mitigation, not a fix — it
      separates a single site from a systemic gap without changing the headline. Refusing a single
      score also costs real adoption: an index is what a management report asks for, and this rubric
      will lose to one that offers a number.
    status: project_policy

  - id: PD-R-EXPOSURE-001
    target: readiness.yaml#aggregation.exposure
    decision: Organizational exposure is the highest control level in production, not a distribution.
    rationale:
      - >-
        Readiness has to be measured against something. The alternative — measuring against the
        typical agent — would let an organization running one C4 payments agent report itself
        against C2, which is the exact self-deception this rubric exists to prevent.
      - >-
        The choice is stated in the rubric as a `known_bias` rather than defended as neutral. A risk
        function reads it as correct; a delivery function reads it as unfair. Both readings are
        available to anyone who sees the result, because the result always carries its exposure.
    external_support: []
    accepted_cost: >-
      One agent sets the bar for the entire organization, so the readiness figure says nothing about
      how far the other agents are from it and can shift a whole control level when a single agent is
      retired. An organization can also lower its exposure by decommissioning one agent rather than by
      improving anything — the rubric would record that as progress, and in a narrow sense it is.
    status: project_policy
