# =============================================================================
# THE SINGLE SOURCE OF TRUTH for the agent READINESS rubric.
#
# The sibling file `rubric.yaml` answers: how much control does THIS AGENT need?
# This file answers the other half: does the ORGANIZATION have that control?
#
#   rubric.yaml    → exposure   (what your agents can do to you)
#   readiness.yaml → readiness  (whether you can carry it)
#
# Readiness is NOT absolute. It is measured relative to the control level the
# organization actually operates: an organization running only C1 agents with
# C1 controls is ready; one running C4 agents with C2 controls is not, even if
# it has "more governance" than the first.
#
# Read by:   agent_evaluator.readiness  (loading, scoring, rendering)
# Rendered:  docs/06-readiness/agent-readiness-rubric.md
#            → run `agent-eval render-docs` after editing.
# Tested:    evaluator/tests/test_readiness_consistency.py fails if docs drift.
# Decided:   every `required` row, the scale, the dimension set, and both
#            aggregation rules are recorded in `policy_decisions.yaml` (INV-6).
#
# Every dimension below is DERIVED from a demand the toolkit already makes
# (the C1–C4 control lists, the go-live gate, the logging requirements, the KPI
# catalog, decision rights, RACI). `derived_from` records that provenance —
# nothing here is invented, and the claim is checkable.
#
# Change the rubric HERE and nowhere else. Documentation and code both follow.
# =============================================================================

version: 1
title: Agent readiness rubric
scale: { min: 0, max: 3 }   # R0 (absent) … R3 (complete). R0 is honestly zero.

# --- Precondition -------------------------------------------------------------
# Not a dimension and not scored — a gate on whether the exposure figure means
# anything. A control level cannot be determined correctly before the regulatory
# classification is known, so a missing answer taints the whole result rather
# than costing a point.
preconditions:
  - key: regulatory_classification
    question: >-
      Has the regulatory classification been determined per agent — your role in
      the value chain (provider / deployer) and the agent's risk category?
    scored: false
    on_missing: >-
      The exposure figure is regulatorily incomplete. Report the readiness result
      with this warning attached; do not present it as an assessment of
      regulatory standing.

# --- Readiness dimensions -----------------------------------------------------
# Each is scored R0–R3 against the anchor that best describes the organization
# as it actually operates. Every anchor is written to be falsifiable: a reviewer
# must be able to ask for the evidence and be told no.
dimensions:
  - key: inventory
    label: Inventory clarity
    question: Does the organization know what it runs?
    derived_from:
      - "C1 control: owner recorded in the agent registry"
      - "C2 control: documented use-case intake and risk assessment on file"
      - "Go-live gate rows 1 and 11"
      - "Provider and model dependency: fields to record per agent, exit by control level"
      - "EU AI Act checklist 1.2–1.4 and 6.4; DORA checklist 1.1–1.3"
    probe: >-
      "Name your third-riskiest agent and its control level." At R2 the answer
      takes minutes, not days.
    anchors:
      0: No list exists. Nobody can say how many agents are in production.
      1: A list exists and names an accountable owner for at least half of the agents in production.
      2: Every agent in production is in the registry with a named owner, a documented intake, and an assigned control level (C1–C4) together with the reasoning for it.
      3: As R2, plus the value-chain role (provider / deployer) is determined per agent, model and provider dependencies are inventoried, and a periodic reconciliation of the registry against actually running systems takes place — and finds discrepancies.
    required: { C1: 1, C2: 2, C3: 2, C4: 3 }

  - key: oversight
    label: Action space and intervention
    question: Is what the agent can do bounded — and can a human get in between?
    derived_from:
      - "C3 control: human-in-the-loop for in-scope actions (explicit approve/reject)"
      - "C4 control: per-action pre-authorization by an accountable human"
      - "Go-live gate rows 3 and 4"
      - "EU AI Act checklist 3.1–3.3; DORA checklist 1.4 (least privilege)"
    probe: >-
      "Show me the test case in which the agent refuses an action outside its
      action space." Without that test case, R2 is not demonstrated.
    anchors:
      0: The agent can do whatever its credentials allow. No defined action space.
      1: The action space is documented but not technically enforced — a breach would be possible and would not be noticed.
      2: "The action space is technically enforced: out-of-scope actions are refused, and the refusal path is covered by a test. Where required, an explicit human gate (approve / reject) exists, not merely a notification."
      3: As R2, plus per-action pre-authorization for C4 agents, and the blocked-action rate is watched as a KPI rather than merely logged.
    required: { C1: 1, C2: 2, C3: 2, C4: 3 }

  - key: traceability
    label: Reconstructability
    question: Can every decision be explained after the fact?
    derived_from:
      - "C1 control: standard logging, errors surfaced to the owning team"
      - "C4 control: continuous monitoring with a tamper-evident audit trail"
      - "Go-live gate row 9; the logging requirements in full"
      - "EU AI Act checklist 4.1; DORA checklist 2.2"
    probe: >-
      "Take a case from last month and reconstruct why the agent chose what it
      chose." Run it; do not accept a description of the log schema.
    self_assessment_caveat: >-
      The dimension a self-assessment most reliably overstates. R2 is proven by
      performing the reconstruction, not by asserting that the fields exist.
    anchors:
      0: Application logs exist, but no decision trail. Why the agent acted cannot be established.
      1: Actions are logged; the mandatory fields are incomplete. A single run can be reconstructed with effort.
      2: Every decision and action produces exactly one record carrying the mandatory fields (run and step id, event type, actor, action and in-scope flag, outcome, model, data categories, human decision, correlation id). No secrets and no raw special-category data. Any given case is traceable to prompt, context, and tool calls within 24 hours.
      3: As R2, plus append-only and integrity-protected, retention defined per agent and data category, and read access restricted — a compromised agent cannot rewrite its own history.
    required: { C1: 1, C2: 2, C3: 3, C4: 3 }

  - key: containment
    label: Stop and roll back
    question: Can the organization halt the agent and undo what it did?
    derived_from:
      - "C3 control: documented rollback and kill-switch procedure"
      - "C4 control: tested kill-switch and incident runbook"
      - "Go-live gate rows 5 and 8"
      - "Incident response: the runbook, stop/rollback by control level, rehearsed scenarios"
      - "EU AI Act checklist 3.4 and 6.1–6.2; DORA checklist 3.1–3.3 and 5.1–5.3"
    probe: >-
      "When was the kill-switch last triggered, and how long did it take to take
      effect?" A documented but never-triggered kill-switch is R1, not R2.
    anchors:
      0: No defined stop. One would have to revoke credentials or shut the service down.
      1: A stop path is described but has never been exercised.
      2: Kill-switch and rollback are documented and have been triggered at least once under realistic conditions, with a record and a measured time to effect.
      3: As R2, plus a rehearsed incident runbook; failure scenarios played through (model or API outage, degraded output, timeout, confidently wrong output); and reporting paths for serious incidents named, time-bound, and exercised.
    required: { C1: 0, C2: 1, C3: 2, C4: 3 }

  - key: assurance
    label: Independent assurance
    question: Does anyone who did not build it check it?
    derived_from:
      - "C3 control: independent (2nd-line) review before go-live"
      - "C4 control: 2nd- and, where relevant, 3rd-line review; board visibility"
      - "Go-live gate row 15; decision rights; RACI (builders do not sign off their own risk)"
    # PD-ASSURANCE-001 — required stays R1 at C2. The C2 control list demands only a named,
    # signing owner; independent 2nd-line review is a C3 control. Demanding R2 here would ask
    # more than the exposure rubric does, which breaks derivation. Accepted cost, stated not
    # hidden: a C2 agent writing into systems the business depends on may be self-approved.
    probe: >-
      "Show me the document in which the second line recorded its finding — not
      the approval, the finding." The dimension where self-image and reality
      diverge furthest.
    anchors:
      0: Whoever builds also signs off.
      1: Sign-off by a named owner, but without functional separation from delivery.
      2: The risk assessment sits with a second line that did not build it; its sign-off is a precondition for go-live from C3 upward; decision rights are written down by control level.
      3: As R2, plus a governance board for C4 agents and for every exception to a mandatory control, and periodic third-line assurance over the programme rather than over individual cases.
    required: { C1: 1, C2: 1, C3: 2, C4: 3 }

  - key: currency
    label: Currency
    question: Is the finding from today, or from go-live?
    derived_from:
      - "C1 control: re-assess on any material change"
      - "C2 control: operational KPIs monitored; re-assessment at least annually"
      - "C3/C4 control: re-assessment quarterly"
      - "Go-live gate rows 10 and 14; KPI catalog; decision rights (material change)"
    probe: >-
      "Which agent is currently furthest past its re-assessment date?" At R3 the
      answer is 'none', and the questioner can see how that is known.
    anchors:
      0: The assessment is from go-live. Nobody has looked since.
      1: KPIs exist, but without thresholds or without alerting; re-assessment is ad hoc and undocumented.
      2: KPIs from all three groups (operational, risk, quality) are wired with thresholds and alerting; "time since last re-assessment" is itself a monitored KPI; material change is defined and demonstrably triggers a re-assessment.
      3: As R2, plus no agent in production is past its cadence (C2 annually, C3 and C4 quarterly), and threshold breaches follow an escalation path with evidence that it has been used.
    required: { C1: 1, C2: 2, C3: 2, C4: 3 }

# --- Aggregation --------------------------------------------------------------
aggregation:
  exposure: highest_level_in_production
  per_dimension:
    required: max_over_agents
    achieved: min_over_triggering_agents
  # Deliberately the minimum, never the mean: the weakest high-risk agent is the
  # one that reaches the organization. A mean can be flattered by harmless agents.
  rationale: >-
    Required is the highest minimum any agent in production triggers. Achieved is
    the LOWEST level reached by an agent that triggers that requirement.
  coverage: dimensions_meeting_required_out_of_total
  report_detail: >-
    Always report how many agents sit below target, not only that the dimension
    does — "1 of 3 C4 agents below target" separates a single site from a
    systemic gap, which the bare achieved/required pair cannot.
  no_single_score: >-
    No 0–100 index value is produced. A single number invites optimizing the
    number instead of the control; a required/achieved pair per dimension does
    not. "4 of 6 at exposure C3" is shareable and cannot be quoted without its
    exposure.
  not_applicable: >-
    An organization with no agents in production has no gap by construction.
    Report "exposure: none in production — the rubric does not apply". Never
    report full coverage, or the rubric measures restraint as maturity.
  known_bias: >-
    Exposure follows the single riskiest agent, not the representative one. A
    risk function reads that as correct; a delivery function reads it as unfair.
    State the choice; do not bury it.
  gaming_path: >-
    Name the way this is gamed, because it is the obvious one: decommissioning
    the single riskiest agent lowers the reported exposure, and every dimension
    measured against it, without one control having improved. Where exactly one
    agent sets the exposure, the result says so — a figure that hangs on one
    system should be read as hanging on one system.

# --- Known simplifications ----------------------------------------------------
# Stated, not hidden. An honest gap is cheaper than a silent one.
simplifications:
  - key: entitlements
    summary: Identity and access management is not a separate dimension.
    detail: >-
      Who may grant an agent access to which system is only partially covered —
      by `oversight` (what the agent may do) and `traceability` (which data
      categories it touches). An agent can be technically confined to its
      documented action space and still hold credentials reaching systems that
      never appear in it. That is an IAM problem, not an action-space problem.
      Treat this as a known simplification, not as coverage.
  - key: third_party
    summary: Provider dependency is a recorded fact, not a dimension of its own.
    detail: >-
      What to record per agent, concentration at the organization level, and exit
      expectations by control level are now sector-independent (see the provider
      dependency doc), so `inventory` at R3 has something real to point at. What
      stays out of reach: contractual provisions and regulated concentration risk,
      which live in the DORA checklist and bind defined financial entities only.
      The rubric measures whether you know your dependency — not whether your
      contracts cover it.
