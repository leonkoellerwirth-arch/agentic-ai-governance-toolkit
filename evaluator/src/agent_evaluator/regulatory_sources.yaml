# =============================================================================
# THE SINGLE SOURCE OF TRUTH for every regulatory reference this toolkit makes.
#
# The checklists in docs/03-checklists/ point at articles of the EU AI Act and
# DORA. An article number alone does not say WHICH VERSION it was written
# against — and EU acts get amended. This file pins that down: for each
# framework, the act, its CELEX id, the Official Journal citation, the
# consolidated version the checklists were last checked against, and the date
# and URL of that check.
#
# What this file deliberately does NOT record:
#   penalties, or any statement about what an obligation requires of YOU. Those
#   are legal conclusions. This file records PROVENANCE — which text, which
#   version, checked when, verifiable where. An amending act's effect on
#   application dates belongs to provenance, not to conclusion: it is part of
#   which text is in force, and withholding it made the checklists read as if
#   deferred obligations already bound the reader.
#   The checklists keep saying "verify"; this file says what to verify against.
#
# Read by:   agent_evaluator.regulatory
# Rendered:  docs/03-checklists/regulatory-sources.md  (the full table)
#            + the source-lock block at the head of each checklist
#            → run `agent-eval render-docs` after editing.
# Tested:    evaluator/tests/test_regulatory_sources.py fails if a checklist
#            cites an article this file does not carry — or if this file
#            carries one no checklist cites.
#
# Change references HERE and nowhere else. Documentation follows.
# =============================================================================

version: 1
title: Regulatory source lock

frameworks:
  - key: eu_ai_act
    label: EU AI Act
    act: Regulation (EU) 2024/1689
    act_de: Verordnung (EU) 2024/1689
    celex: 32024R1689
    oj: OJ L, 2024/1689, 12.7.2024
    # The consolidated text is the one to read: it already incorporates the
    # amendments below. The checklists were written before this consolidation
    # and were re-checked against it on `verified_at`.
    consolidated_celex: 02024R1689-20260727
    consolidated_as_of: 2026-07-27
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    amended_by:
      - act: Regulation (EU) 2026/1744
        act_de: Verordnung (EU) 2026/1744
        celex: 32026R1744
        oj: OJ L, 2026/1744, 24.7.2026
        in_force: 2026-07-27
        eli: http://data.europa.eu/eli/reg/2026/1744/oj
        note: >-
          Digital Omnibus on AI. It moves application dates: the high-risk obligations for
          standalone systems now apply from 2 December 2027, and for high-risk AI embedded in
          products already covered by Union product legislation from 2 August 2028. The transparency
          obligations and the AI-literacy duty are unchanged. Which dates bind you is a legal
          question this toolkit does not answer — but a checklist read without this note reads
          as if every row below were already in force.
        note_de: >-
          Digital Omnibus zur KI. Er verschiebt Geltungsdaten: Die Hochrisiko-Pflichten für
          eigenständige Systeme gelten nun ab dem 2. Dezember 2027, für Hochrisiko-KI, die in
          bereits unionsrechtlich geregelte Produkte eingebettet ist, ab dem 2. August 2028.
          Die Transparenzpflichten und die
          KI-Kompetenzpflicht bleiben unverändert. Welche Daten Sie binden, ist eine
          Rechtsfrage, die dieses Toolkit nicht beantwortet — aber eine Checkliste ohne diesen
          Hinweis liest sich, als gälte jede Zeile darunter bereits.
    references:
      - { id: "5", topic: "prohibited practices" }
      - { id: "6", topic: "high-risk classification" }
      - { id: "annex-III", topic: "high-risk classification list" }
      - { id: "9", topic: "risk management (high-risk)" }
      - { id: "10", topic: "data and data governance (high-risk)" }
      - { id: "11", topic: "technical documentation (high-risk)" }
      - { id: "annex-IV", topic: "technical documentation contents" }
      - { id: "12", topic: "record-keeping (high-risk)" }
      - { id: "13", topic: "transparency and provision of information to deployers (high-risk)" }
      - { id: "14", topic: "human oversight (high-risk)" }
      - { id: "15", topic: "accuracy, robustness and cybersecurity (high-risk)" }
      - { id: "50", topic: "transparency obligations" }
      - { id: "51-55", topic: "general-purpose AI models — classification, procedure, obligations, authorised representatives" }
      # Art. 17(1)(h) and (i) of the consolidated text name these two as the
      # "post-market monitoring system" and the "reporting of a serious incident".
      - { id: "72", topic: "post-market monitoring system (high-risk)" }
      - { id: "73", topic: "reporting of serious incidents (high-risk)" }

  - key: dora
    label: DORA
    act: Regulation (EU) 2022/2554
    act_de: Verordnung (EU) 2022/2554
    celex: 32022R2554
    oj: OJ L 333, 27.12.2022, pp. 1–79
    consolidated_as_of: 2022-12-27
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
    amended_by: []
    references:
      - { id: "5-6", topic: "governance and organisation; ICT risk management framework" }
      - { id: "9", topic: "protection and prevention" }
      - { id: "10", topic: "detection" }
      - { id: "11", topic: "response and recovery" }
      - { id: "12", topic: "backup and restoration" }
      - { id: "17", topic: "ICT-related incident management process" }
      - { id: "18", topic: "classification of ICT-related incidents and cyber threats" }
      - { id: "19", topic: "reporting of major ICT-related incidents and voluntary notification of significant cyber threats" }
      - { id: "24-27", topic: "digital operational resilience testing" }
      - { id: "28", topic: "general principles for sound management of ICT third-party risk" }
      - { id: "30", topic: "key contractual provisions" }

# --- Which document is bound to which framework ---------------------------------
# A bare "Art. 9" means different things in different acts. Binding each document
# to one framework is what makes the reference check unambiguous.
documents:
  - path: docs/03-checklists/eu-ai-act-agent-checklist.en.md
    framework: eu_ai_act
    lang: en
  - path: docs/03-checklists/eu-ai-act-agent-checklist.de.md
    framework: eu_ai_act
    lang: de
  - path: docs/03-checklists/dora-ict-risk-checklist.en.md
    framework: dora
    lang: en
  - path: docs/03-checklists/dora-ict-risk-checklist.de.md
    framework: dora
    lang: de

# --- How this file was checked --------------------------------------------------
# Provenance of the provenance. An AI review, a search result, or a law-firm blog
# is never the source of an entry above — several articles repeating one Official
# Journal publication are one source, not several.
verification:
  verified_at: 2026-08-25
  method: >-
    Every article heading below was compared against the primary text, retrieved from the
    Publications Office Cellar repository — http://publications.europa.eu/resource/celex/{CELEX}
    with Accept: application/xhtml+xml and Accept-Language: eng. This is the official machine
    interface to the same text EUR-Lex renders; the EUR-Lex web pages answer automated requests
    with an empty body, which is why an earlier pass had to fall back on secondary renderings and
    could not be called verification.

    The headings are committed as official_headings.json and a test compares this register
    against them, so the check is repeatable rather than a claim about one afternoon. Seven
    topics were corrected in that pass; what each one said before and what the primary text says
    is recorded in VERIFICATION.md.
  sources:
    - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1689
    - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R1744
    - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
    - http://publications.europa.eu/resource/celex/02024R1689-20260727
    - http://publications.europa.eu/resource/celex/32022R2554
  # Flipped to true only when a human has opened each URL above and confirmed the
  # entries by eye. Not enforced by CI — it is a release-checklist item, and a CI
  # check that can be satisfied by editing one boolean proves nothing.
  owner_verified: true
